name: sound-sizes
# Prints how big each piano sound is (decides which sounds can be packed into the store apps). Actions -> sound-sizes -> Run workflow.
on:
  workflow_dispatch:
  push:
    paths: ["scripts/sound-sizes.sh", ".github/workflows/sound-sizes.yml"]
jobs:
  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: bash scripts/sound-sizes.sh
