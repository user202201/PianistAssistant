name: tests
# All end-to-end tests (tests/README.md). Called by the packaging workflow (the apps are built only when this passes);
# can also be started by hand (Actions -> tests -> Run workflow).
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils   # pdftoppm, used by the converter-script test (tests/shell)
      - run: bash tests/run-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-logs, path: tests/out/*.log }
