name: deploy
# Builds the app and publishes it to GitHub Pages on every push to the default branch.
on:
  push:
    branches: [main, claude/epic-dirac-38xck6]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build   # includes the translation check
        env:
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
      - name: Contact address on the privacy page
        env:
          FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
        run: sed -i "s/{{FEEDBACK_EMAIL}}/${FEEDBACK_EMAIL:-the in-app Help \& feedback}/g" dist/privacy/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
