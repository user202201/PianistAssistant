name: ocr-lab
# Measures how well PDF -> MusicXML conversion works: PDFs made from known scores (samples/ocr-lab) are converted and compared with the
# originals. Run it by hand (Actions -> ocr-lab -> Run workflow) or it runs when the converter changes.
on:
  workflow_dispatch:
  push:
    branches: [claude/epic-dirac-38xck6]
    paths: ["scores-repo-template/convert-one.sh", "scripts/ocr-lab.sh", "scripts/ocr-compare.py", "samples/ocr-lab/**", ".github/workflows/ocr-lab.yml"]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Audiveris
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng jq unzip poppler-utils libtiff-tools
          url=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/Audiveris/audiveris/releases/latest |
            jq -r '([.assets[].browser_download_url | select(test("(?i)ubuntu.*(x86_64|amd64).*\\.deb$"))][0]) // ([.assets[].browser_download_url | select(test("(?i)\\.deb$"))][0])')
          echo "Using $url"
          curl -fsSL -o /tmp/audiveris.deb "$url"
          mkdir -p /tmp/audiveris-root && dpkg-deb -x /tmp/audiveris.deb /tmp/audiveris-root
          AUD=$(find /tmp/audiveris-root -type f -name Audiveris | head -1); chmod +x "$AUD"; echo "AUD=$AUD" >> "$GITHUB_ENV"
          td=$(find /usr/share -name eng.traineddata 2>/dev/null | head -1); [ -n "$td" ] && echo "TESSDATA_PREFIX=$(dirname "$td")" >> "$GITHUB_ENV"
          echo "JAVA_TOOL_OPTIONS=-Djava.awt.headless=true" >> "$GITHUB_ENV"
          "$AUD" -help 2>&1 | head -60 || true
      - name: Run the lab
        run: bash scripts/ocr-lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ocr-lab-results, path: /tmp/lab-out/* }
