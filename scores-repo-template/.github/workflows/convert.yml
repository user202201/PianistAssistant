name: convert
# Lives in the PRIVATE scores repo (PianistScores). Whenever the app queues a PDF / photo in inbox/,
# this converts it to MusicXML in scores/. The logic lives in the (public) PianistAssistant repo
# (scores-repo-template/convert.sh) so it can be improved without editing this file again.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convert
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: user202201/PianistAssistant
          path: .tools
      - name: Convert inbox files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .tools/scores-repo-template/convert.sh
