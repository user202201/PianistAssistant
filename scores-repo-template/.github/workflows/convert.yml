name: convert
# Lives in the PRIVATE scores repo (PianistScores). Whenever the app queues a PDF / photo in inbox/,
# this converts it to MusicXML in scores/. The logic lives in the (public) PianistAssistant repo
# (scores-repo-template/convert.sh) so it can be improved without editing this file again.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convert
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The converter scripts are taken from this repository when they are there (tools/), otherwise from the public
      # PianistAssistant repository. After the code repository becomes private, put tools/ into this repository
      # (see docs/going-private/README.md) and nothing else has to change.
      - name: Get the converter
        run: |
          if [ -f tools/convert.sh ]; then echo "TOOLS=tools" >> "$GITHUB_ENV"; else
            git clone --depth 1 https://github.com/user202201/PianistAssistant .tools && echo "TOOLS=.tools/scores-repo-template" >> "$GITHUB_ENV"
          fi
      - name: Convert inbox files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$TOOLS/convert.sh"
